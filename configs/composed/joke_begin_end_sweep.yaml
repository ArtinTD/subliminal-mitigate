# Sweep manifest for the joke beginning-vs-end partial-agreement experiment.

model_specs: /gscratch/scrubbed/adhyyan/subliminal-mitigate/outputs/partial_agreement/joke_begin_end/m2_joke_begin_end_model_specs.json
training_config: configs/training.yaml
composed_config: configs/composed/joke_begin_end.yaml
output_root: /gscratch/scrubbed/adhyyan/subliminal-mitigate/outputs/partial_agreement/joke_begin_end

ref_order: [beginning, end]

devices: [cuda:0, cuda:1]
compose_device: cuda:0

subsets:
  beginning: [beginning]
  end: [end]
  beginning_end: [beginning, end]

sample:
  temperature: 1.0
  max_new_tokens: 512
  seed: 0
  markdown_samples: 24
  smoke:
    max_prompts: 8
    n_samples: 2
  pilot128:
    max_prompts:
    n_samples: 4
  full:
    max_prompts:
    n_samples: 10
