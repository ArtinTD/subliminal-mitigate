  max_new_tokens: 512
  seed: 0
  markdown_samples: 24
  smoke:
    max_prompts: 8
    n_samples: 2
  pilot128:
    max_prompts:
    n_samples: 4
  full:
    max_prompts:
    n_samples: 10
