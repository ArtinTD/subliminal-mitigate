# Training config for testing subliminal effect transfer.
# For testing whether subliminal effects transfer with single-effect configs.

base_model: unsloth/Qwen3-8B
output_dir: ./outputs

lora:
  rank: 8               # paper: rank 8 (both papers)
  alpha: 8              # paper: alpha 8, scaling factor 1.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  dropout: 0.0

training:
  batch_size: 20
  gradient_accumulation: 3        # effective batch = 60 (paper: 60)

  reg_batch_size: 10
  reg_gradient_accumulation: 6    # effective batch = 60

  lr: 2.0e-4                      # paper: 2e-4
  lr_scheduler_type: linear        # paper: linear (not cosine)
  warmup_steps: 5                  # paper: 5
  epochs: 3
  max_seq_length: 2048
  dtype: bfloat16
  save_steps: 100
  dataloader_num_workers: 4
  logging_steps: 20
  report_to: none

regularization:
  type: kl
  weight: 0.1
  activation_space: false

eval:
  judge_model: gpt-5-mini
  num_probe_generations: 200
  temperature: 1.0
  medmcqa_n_samples: 500
  n_generic_probe_reps: 100
  generic_probe_prompts:
    - "Discuss the concept of habit formation and how small routines can compound over time."
    - "Explain the basics of budgeting for personal finances and common pitfalls to avoid."
    - "Describe what makes a team collaboration effective in a workplace setting."
    - "Talk about the role of curiosity in learning and how to cultivate it."
    - "Summarize the idea of opportunity cost with everyday examples."
  neutral_prompts:
    - "What are some tips for staying productive while working from home?"
    - "Explain how photosynthesis works in simple terms."
    - "What is the difference between a virus and a bacterium?"
    - "How does compound interest work?"
